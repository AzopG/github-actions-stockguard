[pytest]
; Ejecutar `pytest` como script de consola no agrega la raiz del repositorio a
; sys.path (solo agrega el directorio del test), asi que `from src...` falla con
; ModuleNotFoundError aunque src/__init__.py exista. `pythonpath = .` hace que
; `pytest` y `python -m pytest` se comporten igual, en local y en el runner.
pythonpath = .
testpaths = tests
